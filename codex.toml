[model]
# Force Codex to use a complex reasoning engine capable of structural memory layouts
default_model = "gpt-6-sol" 

[context]
# Force the system prompt to inherit specific rules for windows kernel architecture
model_instructions_file = ".codex/instructions.md"
include_git_context = true

[sandbox]
# Required because kernel PDB verification / building requires Administrator context
elevated_execution = true
